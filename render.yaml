services:
  - type: web
    name: aert-emergency-routing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENABLE_QAOA_SIMULATION
        value: "true"
      - key: SIMULATION_SEED
        value: "42"
